<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gaurav's Coaching Centre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1><a href="index.html" style="color:white; text-decoration:none;">Gaurav's Coaching Centre</a></h1>
    </header>

    <main class="container">
        
        <div class="form-container">
            <h2>Student Login</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>Aapka account nahi hai? <a href="register.html">Yahan register karein</a></p>
        </div>

    </main>

    <footer>
        <p>&copy; 2025 Gaurav's Coaching Centre. All rights reserved.</p>
    </footer>

</body>
</html>
