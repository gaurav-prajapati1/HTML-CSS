<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Calculator</title>
    <style>
        /* CSS: Styling the Calculator UI */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 32px;
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            background: #444;
            color: white;
            border: none;
            border-radius: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Number buttons */
        .btn-num { background-color: #666; color: white; }
        .btn-num:hover { background-color: #888; }

        /* Operator buttons */
        .btn-op { background-color: #f39c12; color: white; }
        .btn-op:hover { background-color: #e67e22; }

        /* Special buttons */
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-clear:hover { background-color: #c0392b; }

        .btn-equal { 
            background-color: #27ae60; 
            color: white; 
            grid-column: span 2; 
        }
        .btn-equal:hover { background-color: #219150; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled placeholder="0">

        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-num" onclick="appendToDisplay('(')">(</button>
            <button class="btn-num" onclick="appendToDisplay(')')">)</button>
            <button class="btn-op" onclick="appendToDisplay('/')">÷</button>

            <button class="btn-num" onclick="appendToDisplay('7')">7</button>
            <button class="btn-num" onclick="appendToDisplay('8')">8</button>
            <button class="btn-num" onclick="appendToDisplay('9')">9</button>
            <button class="btn-op" onclick="appendToDisplay('*')">×</button>

            <button class="btn-num" onclick="appendToDisplay('4')">4</button>
            <button class="btn-num" onclick="appendToDisplay('5')">5</button>
            <button class="btn-num" onclick="appendToDisplay('6')">6</button>
            <button class="btn-op" onclick="appendToDisplay('-')">-</button>

            <button class="btn-num" onclick="appendToDisplay('1')">1</button>
            <button class="btn-num" onclick="appendToDisplay('2')">2</button>
            <button class="btn-num" onclick="appendToDisplay('3')">3</button>
            <button class="btn-op" onclick="appendToDisplay('+')">+</button>

            <button class="btn-num" onclick="appendToDisplay('0')">0</button>
            <button class="btn-num" onclick="appendToDisplay('.')">.</button>
            <button class="btn-equal" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        // JavaScript: Handling the Math
        const display = document.getElementById('display');

        // Adds the clicked button value to the screen
        function appendToDisplay(input) {
            display.value += input;
        }

        // Clears the screen
        function clearDisplay() {
            display.value = "";
        }

        // Evaluates the string as a mathematical expression
        function calculateResult() {
            try {
                // eval() processes the string logic (e.g., "10 + 2 * 5")
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
                // Reset error message after 1.5 seconds
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
</html>
