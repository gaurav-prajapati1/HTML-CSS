<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Basic Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Table Container for Responsiveness */
        .table-container {
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        /* Header Styling */
        thead {
            background-color: #2c3e50;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        /* Zebra Striping */
        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        /* Hover Effect */
        tbody tr:hover {
            background-color: #e9ecef;
            cursor: pointer;
        }

        /* Making it look nice on small screens */
        @media (max-width: 600px) {
            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul Sharma</td>
                <td>BCA</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Priya Singh</td>
                <td>BBA</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Amit Kumar</td>
                <td>B.Tech</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
